<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" role="img" aria-label="El Beholder — ojo con alas">
  <!-- Mascota del Beholder: ojo con alas cartoonish (flota, aletea y parpadea) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 7; 0 0" dur="2.6s" repeatCount="indefinite"/>

    <!-- Ala izquierda -->
    <g transform="translate(122,105)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="10;-16;10" dur="0.65s" repeatCount="indefinite"/>
        <path d="M0,0 C-28,-42 -82,-52 -106,-38 C-78,-30 -73,-24 -92,-13 C-68,-10 -63,-3 -78,8 C-54,10 -42,12 -20,18 Z"
              fill="#FFFFFF" stroke="#1F2328" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Ala derecha (espejo) -->
    <g transform="translate(258,105) scale(-1,1)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="10;-16;10" dur="0.65s" repeatCount="indefinite"/>
        <path d="M0,0 C-28,-42 -82,-52 -106,-38 C-78,-30 -73,-24 -92,-13 C-68,-10 -63,-3 -78,8 C-54,10 -42,12 -20,18 Z"
              fill="#FFFFFF" stroke="#1F2328" stroke-width="6" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Globo ocular -->
    <circle cx="190" cy="108" r="58" fill="#FFFFFF" stroke="#1F2328" stroke-width="6"/>

    <!-- Iris + pupila (miran de un lado a otro) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 9 2; -7 1; 0 0" keyTimes="0;0.3;0.65;1" dur="5.5s" repeatCount="indefinite"/>
      <circle cx="190" cy="108" r="27" fill="#6D4AE7"/>
      <circle cx="190" cy="108" r="12" fill="#1F2328"/>
      <circle cx="198" cy="99" r="5.5" fill="#FFFFFF"/>
    </g>

    <!-- Párpado (parpadeo) -->
    <ellipse cx="190" cy="108" rx="58" ry="0" fill="#CDB4F6" stroke="#1F2328" stroke-width="4" opacity="0">
      <animate attributeName="ry" values="0;0;58;0;0" keyTimes="0;0.46;0.5;0.54;1" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.45;0.5;0.55;1" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Destellos -->
    <g fill="#6D4AE7">
      <path d="M62,40 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M318,52 l2.5,7 7,2.5 -7,2.5 -2.5,7 -2.5,-7 -7,-2.5 7,-2.5 z">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Lema -->
  <text x="190" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="17" fill="#6D4AE7">“Beauty is in the eye of the beholder”</text>
</svg>
