<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="380" role="img" aria-label="El Beholder — ojo con alas">
  <!-- Mascota del Beholder: ojo con alas en estilo pastel, granular y tenue -->
  <defs>
    <radialGradient id="globo" cx="0.42" cy="0.36" r="0.85">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#F1E8F6"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0%" stop-color="#D8C6F5"/>
      <stop offset="100%" stop-color="#A98CE3"/>
    </radialGradient>
    <linearGradient id="ala" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBEAF2"/>
      <stop offset="100%" stop-color="#EDDDF3"/>
    </linearGradient>
    <!-- Textura de grano -->
    <filter id="grano">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10" intercept="0"/></feComponentTransfer>
    </filter>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
  </defs>

  <g filter="url(#suave)" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 7; 0 0" dur="2.8s" repeatCount="indefinite"/>

    <!-- Ala izquierda -->
    <g transform="translate(122,105)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="8;-13;8" dur="0.8s" repeatCount="indefinite"/>
        <path d="M0,0 C-28,-42 -82,-52 -106,-38 C-78,-30 -73,-24 -92,-13 C-68,-10 -63,-3 -78,8 C-54,10 -42,12 -20,18 Z"
              fill="url(#ala)" stroke="#C7A9CF" stroke-width="3.5" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Ala derecha (espejo) -->
    <g transform="translate(258,105) scale(-1,1)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="8;-13;8" dur="0.8s" repeatCount="indefinite"/>
        <path d="M0,0 C-28,-42 -82,-52 -106,-38 C-78,-30 -73,-24 -92,-13 C-68,-10 -63,-3 -78,8 C-54,10 -42,12 -20,18 Z"
              fill="url(#ala)" stroke="#C7A9CF" stroke-width="3.5" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Globo ocular -->
    <circle cx="190" cy="108" r="58" fill="url(#globo)" stroke="#BCA6D4" stroke-width="3.5"/>

    <!-- Iris + pupila (miran de un lado a otro) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 9 2; -7 1; 0 0" keyTimes="0;0.3;0.65;1" dur="6s" repeatCount="indefinite"/>
      <circle cx="190" cy="108" r="27" fill="url(#iris)"/>
      <circle cx="190" cy="108" r="12" fill="#7A6AAE"/>
      <circle cx="198" cy="99" r="5.5" fill="#FFFFFF" opacity="0.85"/>
      <circle cx="182" cy="116" r="3" fill="#FFFFFF" opacity="0.5"/>
    </g>

    <!-- Rubor -->
    <ellipse cx="146" cy="132" rx="10" ry="6" fill="#F6C9D8" opacity="0.55"/>
    <ellipse cx="234" cy="132" rx="10" ry="6" fill="#F6C9D8" opacity="0.55"/>

    <!-- Párpado (parpadeo) -->
    <ellipse cx="190" cy="108" rx="58" ry="0" fill="#E8DBF6" stroke="#C7B3E0" stroke-width="3" opacity="0">
      <animate attributeName="ry" values="0;0;58;0;0" keyTimes="0;0.46;0.5;0.54;1" dur="4.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.45;0.5;0.55;1" dur="4.6s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Destellos -->
    <g>
      <path d="M62,40 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z" fill="#F4D8A9" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.25;0.8" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M318,52 l2.5,7 7,2.5 -7,2.5 -2.5,7 -2.5,-7 -7,-2.5 7,-2.5 z" fill="#BFE3D9" opacity="0.5">
        <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <circle cx="96" cy="70" r="2.5" fill="#D8C6F5" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="290" cy="86" r="2" fill="#F6C9D8" opacity="0.6">
        <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- Capa de grano sobre toda la figura -->
  <rect width="380" height="240" filter="url(#grano)"/>

  <!-- Lema -->
  <text x="190" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="17" fill="#A78BCB">“Beauty is in the eye of the beholder”</text>
</svg>
